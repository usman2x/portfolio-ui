name: Deploy Portfolio UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-portfolio-ui
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Gatsby site
        run: npm run build
        env:
          GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
          GATSBY_FORM_LINK: ${{ vars.GATSBY_FORM_LINK }}
          GATSBY_SITE_URL: ${{ vars.GATSBY_SITE_URL }}
          GATSBY_GISCUS_REPO: ${{ vars.GATSBY_GISCUS_REPO }}
          GATSBY_GISCUS_REPO_ID: ${{ vars.GATSBY_GISCUS_REPO_ID }}
          GATSBY_GISCUS_CATEGORY: ${{ vars.GATSBY_GISCUS_CATEGORY }}
          GATSBY_GISCUS_CATEGORY_ID: ${{ vars.GATSBY_GISCUS_CATEGORY_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: www.musman.online
