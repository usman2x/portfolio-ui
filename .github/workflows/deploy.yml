name: Deploy Portfolio UI

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - cms-content-published
  workflow_dispatch:

concurrency:
  group: deploy-portfolio-ui
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build
        env:
          NEXT_PUBLIC_GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
          NEXT_PUBLIC_FORM_LINK: ${{ vars.NEXT_PUBLIC_FORM_LINK }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PATH_PREFIX: ${{ vars.NEXT_PUBLIC_PATH_PREFIX }}
          PAYLOAD_API_URL: ${{ vars.PAYLOAD_API_URL }}
          PAYLOAD_POSTS_ENDPOINT: ${{ vars.PAYLOAD_POSTS_ENDPOINT }}

      - name: Deploy to GitHub Pages with custom domain
        if: ${{ vars.GITHUB_PAGES_CNAME != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: ${{ vars.GITHUB_PAGES_CNAME }}

      - name: Deploy to GitHub Pages
        if: ${{ vars.GITHUB_PAGES_CNAME == '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
